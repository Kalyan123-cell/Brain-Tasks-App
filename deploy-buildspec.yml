version: 0.2

phases:
  install:
    commands:
      - echo "Configure EKS Access"
      - aws eks update-kubeconfig --region ap-south-2 --name Brain-Task-App

  build:
    commands:
      - echo "Deploying application"
      - kubectl apply -f deployment.yml
      - kubectl apply -f service.yml
      - kubectl get pods
      - kubectl get svc




