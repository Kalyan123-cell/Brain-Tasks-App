apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-task-app

spec:
  replicas: 2
  selector:
    matchLabels:
      app: brain-task-app
  
  template:
    metadata:
      labels:
        app: brain-task-app
    spec:
      containers:
      - name: brain-task-app
        image: kalyangogu/brain-task-app
        ports:
        - containerPort: 80
